<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="screen-title screen-description"><title id="screen-title">Recover account access</title><desc id="screen-description">An illustrative account-recovery sequence with clear next steps.</desc>
  
  <defs>
    <style>
      * { 
        font-family: 'Trebuchet MS', 'Nirmala UI', Arial, sans-serif;
        text-rendering: geometricPrecision; 
        -webkit-font-smoothing: antialiased; 
        -moz-osx-font-smoothing: grayscale;
      }
      .mono { 
        font-family: 'Trebuchet MS', 'Nirmala UI', Arial, sans-serif;
        font-feature-settings: "tnum" 1; 
      }
      .stat-anchor { font-weight: 700; font-variant-numeric: tabular-nums; }
      .badge { font-weight: 700; text-anchor: middle; }
    </style>

    <!-- USWDS Gradients -->
    <linearGradient id="govPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075A46" />
      <stop offset="100%" stop-color="#075A46" />
    </linearGradient>
    <linearGradient id="govOchreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A4F13" />
      <stop offset="100%" stop-color="#8A4F13" />
    </linearGradient>
    <linearGradient id="govHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075A46" />
      <stop offset="100%" stop-color="#075A46" />
    </linearGradient>

    <!-- Elevation is reserved for dialogs. -->
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#152E35" flood-opacity="0.32" />
    </filter>

  </defs>
  <rect width="100%" height="100%" fill="#EEF3F3" />
  
  <!-- USWDS Official Government Banner -->
  <g class="usa-banner">
    <rect width="1440" height="32" fill="#EEF3F3" stroke="#CFDADD" />
    <g transform="translate(48, 6)">
      <!-- Government Seal / Ashoka Emblem Vector Graphic -->
      <circle cx="10" cy="10" r="9" fill="#075A46" />
      <circle cx="10" cy="10" r="5" fill="#FFFFFF" />
      <circle cx="10" cy="10" r="2.5" fill="#075A46" />
      
      <text x="26" y="14" font-size="11" font-weight="600" fill="#152E35">
        Tribe Saarthi · Scholarship support for tribal students
      </text>

      <!-- Security HTTPS Seal -->
      <g transform="translate(1120, 1)">
        
    <g transform="translate(0, 2) scale(0.5833333333333334)" fill="none" stroke="#075A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </g>
        <text x="18" y="13" font-size="11" font-weight="600" fill="#075A46">Design preview · Sample records</text>
      </g>
    </g>
  </g>
  <rect y="32" width="1440" height="82" fill="#FFFFFF" stroke="#CFDADD" />
  <circle cx="68" cy="73" r="22" fill="#075A46" />
  <text x="68" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">TS</text>
  <text x="104" y="72" font-size="24" font-weight="700" fill="#152E35">Tribe Saarthi</text>
  <text x="104" y="94" font-size="12" fill="#52666D">Scholarship support for tribal students</text>
  <text x="1376" y="80" text-anchor="end" font-size="14" fill="#075A46">English / हिंदी</text>
  <g transform="translate(420, 192)">
    <rect width="600" height="558" rx="8" fill="#FFFFFF" stroke="#CFDADD" />
    <path d="M0 8Q0 0 8 0H592Q600 0 600 8" stroke="#075A46" stroke-width="4" />
    <text x="36" y="60" font-size="28" font-weight="700" fill="#152E35">Reset your password</text>
    <text x="36" y="96" font-size="15" fill="#52666D">Enter the email you use to sign in.</text>
    <text x="36" y="122" font-size="15" fill="#52666D">We'll send you a link to choose a new password.</text>
    <text x="36" y="181" font-size="14" font-weight="700" fill="#152E35">Email address</text>
    <rect x="36" y="196" width="528" height="52" rx="4" fill="#FFFFFF" stroke="#52666D" />
    <text x="52" y="228" font-size="16" fill="#152E35">mohan@example.test</text>
    <rect x="36" y="276" width="528" height="52" rx="4" fill="#075A46" />
    <text x="300" y="309" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Send reset link</text>
    <text x="36" y="367" font-size="14" font-weight="700" fill="#075A46">Back to sign in</text>
    <line x1="36" y1="398" x2="564" y2="398" stroke="#CFDADD" />
    <text x="36" y="434" font-size="16" font-weight="700" fill="#152E35">Can't access your email?</text>
    <text x="36" y="462" font-size="14" fill="#52666D">Ask your institution's scholarship officer for help.</text>
    <text x="36" y="504" font-size="13" fill="#52666D">If an account uses this email, a reset link will be sent.</text>
  </g>
</svg>