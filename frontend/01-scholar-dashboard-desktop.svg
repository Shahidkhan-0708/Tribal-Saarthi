<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="screen-title screen-description"><title id="screen-title">Scholar dashboard</title><desc id="screen-description">College review status, the next action, a document checklist, and recent application updates.</desc>
  
  <defs>
