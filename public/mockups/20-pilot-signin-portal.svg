<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="screen-title screen-description"><title id="screen-title">Sign in</title><desc id="screen-description">Invitation-based email and password sign-in for the pilot.</desc>
  
  <defs>
    <style>
      * { 
        font-family: 'Trebuchet MS', 'Nirmala UI', Arial, sans-serif;
        text-rendering: geometricPrecision; 
        -webkit-font-smoothing: antialiased; 
        -moz-osx-font-smoothing: grayscale;
      }
      .mono { 
        font-family: 'Trebuchet MS', 'Nirmala UI', Arial, sans-serif;
        font-feature-settings: "tnum" 1; 
      }
      .stat-anchor { font-weight: 700; font-variant-numeric: tabular-nums; }
      .badge { font-weight: 700; text-anchor: middle; }
    </style>

    <!-- USWDS Gradients -->
    <linearGradient id="govPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075A46" />
      <stop offset="100%" stop-color="#075A46" />
    </linearGradient>
    <linearGradient id="govOchreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A4F13" />
      <stop offset="100%" stop-color="#8A4F13" />
    </linearGradient>
    <linearGradient id="govHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075A46" />
      <stop offset="100%" stop-color="#075A46" />
    </linearGradient>

    <!-- Elevation is reserved for dialogs. -->
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#152E35" flood-opacity="0.32" />
    </filter>

  </defs>
  <rect width="100%" height="100%" fill="#EEF3F3" />
  
  <!-- USWDS Official Government Banner -->
  <g class="usa-banner">
    <rect width="1440" height="32" fill="#EEF3F3" stroke="#CFDADD" />
    <g transform="translate(48, 6)">
      <!-- Government Seal / Ashoka Emblem Vector Graphic -->
      <circle cx="10" cy="10" r="9" fill="#075A46" />
      <circle cx="10" cy="10" r="5" fill="#FFFFFF" />
      <circle cx="10" cy="10" r="2.5" fill="#075A46" />
      
      <text x="26" y="14" font-size="11" font-weight="600" fill="#152E35">
        Tribe Saarthi · Scholarship support for tribal students
      </text>

      <!-- Security HTTPS Seal -->
      <g transform="translate(1120, 1)">
        
    <g transform="translate(0, 2) scale(0.5833333333333334)" fill="none" stroke="#075A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </g>
        <text x="18" y="13" font-size="11" font-weight="600" fill="#075A46">Design preview · Sample records</text>
      </g>
    </g>
  </g>
  <rect y="32" width="1440" height="82" fill="#FFFFFF" stroke="#CFDADD" />
  <circle cx="68" cy="73" r="22" fill="#075A46" />
  <text x="68" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">TS</text>
  <text x="104" y="72" font-size="24" font-weight="700" fill="#152E35">Tribe Saarthi</text>
  <text x="104" y="94" font-size="12" fill="#52666D">Scholarship support for tribal students</text>
  <text x="1376" y="80" text-anchor="end" font-size="14" fill="#075A46">English / हिंदी</text>
  <g transform="translate(100, 218)">
    <text x="0" y="40" font-size="38" font-weight="700" fill="#152E35">A clearer path to</text>
    <text x="0" y="90" font-size="38" font-weight="700" fill="#152E35">your scholarship.</text>
    <text x="0" y="134" font-size="17" fill="#52666D">Apply, keep your documents together, and follow</text>
    <text x="0" y="162" font-size="17" fill="#52666D">each decision from your college to your bank.</text>
    <line x1="20" y1="226" x2="20" y2="450" stroke="#CFDADD" stroke-width="2" />
    
      <g transform="translate(0, 216)">
        <circle cx="20" cy="16" r="20" fill="#E8F2EE" />
        
    <g transform="translate(10, 6) scale(0.8333333333333334)" fill="none" stroke="#075A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </g>
        <text x="60" y="19" font-size="19" font-weight="700" fill="#152E35">Find the right scheme</text>
        <text x="60" y="47" font-size="14" fill="#52666D">Understand the requirements before you apply.</text>
      </g>
      <g transform="translate(0, 320)">
        <circle cx="20" cy="16" r="20" fill="#E8F2EE" />
        
    <g transform="translate(10, 6) scale(0.8333333333333334)" fill="none" stroke="#075A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
    </g>
        <text x="60" y="19" font-size="19" font-weight="700" fill="#152E35">Use your documents again</text>
        <text x="60" y="47" font-size="14" fill="#52666D">Keep them ready for your next application.</text>
      </g>
      <g transform="translate(0, 424)">
        <circle cx="20" cy="16" r="20" fill="#E8F2EE" />
        
    <g transform="translate(10, 6) scale(0.8333333333333334)" fill="none" stroke="#075A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="9 12 11 14 15 10"/>
    </g>
        <text x="60" y="19" font-size="19" font-weight="700" fill="#152E35">Know what happens next</text>
        <text x="60" y="47" font-size="14" fill="#52666D">See who is reviewing your application.</text>
      </g>
  </g>
  <g transform="translate(820, 182)">
    <rect width="520" height="618" rx="8" fill="#FFFFFF" stroke="#CFDADD" />
    <path d="M0 8Q0 0 8 0H512Q520 0 520 8" stroke="#075A46" stroke-width="4" />
    <text x="36" y="58" font-size="28" font-weight="700" fill="#152E35">Sign in to your account</text>
    <text x="36" y="89" font-size="14" fill="#52666D">Use the email on your pilot invitation.</text>
    <text x="36" y="145" font-size="14" font-weight="700" fill="#152E35">Email address</text>
    <rect x="36" y="158" width="448" height="52" rx="4" fill="#FFFFFF" stroke="#52666D" />
    <text x="52" y="190" font-size="16" fill="#152E35">mohan@example.test</text>
    <text x="36" y="251" font-size="14" font-weight="700" fill="#152E35">Password</text>
    <rect x="36" y="264" width="448" height="52" rx="4" fill="#FFFFFF" stroke="#52666D" />
    <text x="52" y="296" font-size="18" fill="#152E35">••••••••••••</text>
    <text x="484" y="346" text-anchor="end" font-size="14" font-weight="700" fill="#075A46">Forgot password?</text>
    <rect x="36" y="374" width="448" height="52" rx="4" fill="#075A46" />
    <text x="260" y="407" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Sign in</text>
    <line x1="36" y1="458" x2="484" y2="458" stroke="#CFDADD" />
    <text x="36" y="492" font-size="16" font-weight="700" fill="#152E35">Don't have an invitation?</text>
    <text x="36" y="520" font-size="14" fill="#52666D">Ask your institution's scholarship officer.</text>
    <text x="36" y="558" font-size="14" font-weight="700" fill="#075A46">Get help signing in</text>
  </g>
  <text x="100" y="894" font-size="13" fill="#52666D">Invite-only pilot · Sample account shown</text>
  <text x="1340" y="894" text-anchor="end" font-size="13" fill="#075A46">Privacy and support</text>
</svg>